<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORTAL ABSENSI ENTERPRISE</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
--primary:#0d6efd;
--secondary:#4dabf7;
--glass:rgba(255,255,255,0.2);
--text:white;
}

body{
margin:0;
font-family:'Segoe UI',sans-serif;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,var(--primary),var(--secondary));
height:100vh;
overflow:hidden;
transition:0.5s;
}

.dark{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.app{
width:100%;
max-width:420px;
height:100vh;
position:relative;
border-radius:30px;
overflow:hidden;
box-shadow:0 20px 60px rgba(0,0,0,0.4);
}

.content{
position:absolute;
inset:0;
padding:20px;
padding-bottom:90px;
overflow-y:auto;
}

.glass{
background:var(--glass);
backdrop-filter:blur(15px);
border-radius:25px;
padding:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
border:1px solid rgba(255,255,255,0.3);
color:var(--text);
}

.title{
text-align:center;
color:white;
font-weight:700;
margin-bottom:10px;
}

.clock{
text-align:center;
color:white;
margin-bottom:15px;
}

.bottom-nav{
position:absolute;
bottom:0;
left:0;
right:0;
height:70px;
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
}

.bottom-nav i{
color:white;
font-size:22px;
}

#video{
width:100%;
border-radius:20px;
}

.hidden{display:none;}

.toast-modern{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
background:white;
color:black;
padding:10px 20px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
display:none;
z-index:20;
}

.loading{
position:absolute;
inset:0;
background:rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
z-index:30;
}

</style>
</head>

<body>

<div class="app">

<div class="toast-modern" id="toast"></div>

<div class="loading" id="loading">
<div class="spinner-border text-light"></div>
</div>

<div class="content">

<div class="title">PORTAL ABSENSI SMP N 2 KAWALI</div>
<div class="clock" id="clock"></div>

<div class="glass mb-3" id="gpsStatus">
<i class="bi bi-geo-alt-fill"></i> Mendeteksi GPS...
</div>

<div class="glass" id="loginArea">

<select id="role" class="form-select mb-3">
<option value="admin">Admin</option>
<option value="teacher">Teacher</option>
<option value="petugas">Petugas</option>
</select>

<input type="text" id="username" class="form-control mb-3" placeholder="Username">
<input type="password" id="password" class="form-control mb-3" placeholder="Password">

<button class="btn btn-primary w-100" onclick="login()">LOGIN</button>

</div>

<div id="dashboard" class="hidden">

<div class="glass mb-3 text-center">
<h6 id="welcome"></h6>
</div>

<div id="petugasPanel" class="hidden">

<div class="glass mb-3">
<input type="text" id="searchSiswa" class="form-control mb-2"
placeholder="Cari siswa..." onkeyup="cari()">
<select id="hasilSiswa" class="form-select"></select>
</div>

<div class="glass mb-3">
<video id="video" autoplay playsinline></video>
</div>

<button class="btn btn-success w-100 mb-2" onclick="absen('Masuk')">ABSEN MASUK</button>
<button class="btn btn-danger w-100" onclick="absen('Pulang')">ABSEN PULANG</button>

</div>

<div class="glass mt-3">
<canvas id="chart"></canvas>
</div>

</div>

</div>

<div class="bottom-nav">
<i class="bi bi-house-fill"></i>
<i class="bi bi-camera-fill"></i>
<i class="bi bi-bar-chart-fill"></i>
</div>

</div>

<script>

const API_URL="PASTE_URL_WEB_APP_ANDA";
let currentUser="";

/* ===== DARK MODE AUTO ===== */
let hour=new Date().getHours();
if(hour>=18 || hour<=6){
document.body.classList.add("dark");
}

/* ===== CLOCK ===== */
setInterval(()=>{
clock.innerHTML=new Date().toLocaleTimeString();
},1000);

/* ===== GPS ===== */
navigator.geolocation.getCurrentPosition(pos=>{
gpsStatus.innerHTML='<i class="bi bi-geo-alt-fill"></i> GPS Aktif';
},()=>{
gpsStatus.innerHTML='<i class="bi bi-x-circle-fill"></i> GPS Tidak Aktif';
});

/* ===== TOAST ===== */
function showToast(msg){
toast.innerHTML=msg;
toast.style.display="block";
setTimeout(()=>{toast.style.display="none";},2000);
}

/* ===== LOADING ===== */
function showLoading(x){
loading.style.display=x?"flex":"none";
}

/* ===== LOGIN ===== */
function login(){

showLoading(true);

let form=new FormData();
form.append("action","login");
form.append("username",username.value);
form.append("password",password.value);

fetch(API_URL,{method:"POST",body:form})
.then(r=>r.json())
.then(res=>{
showLoading(false);

if(res.status){
currentUser=res.nama;
loginArea.classList.add("hidden");
dashboard.classList.remove("hidden");
welcome.innerHTML="Selamat Datang, "+res.nama;

if(res.role=="petugas"){
petugasPanel.classList.remove("hidden");
initCamera();
}

loadChart();
showToast("Login Berhasil ✅");

}else{
showToast("Login Gagal ❌");
}
});
}

/* ===== CAMERA ===== */
function initCamera(){
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{video.srcObject=stream;});
}

function ambilFoto(){
let canvas=document.createElement("canvas");
canvas.width=400;
canvas.height=300;
canvas.getContext("2d").drawImage(video,0,0,400,300);
return canvas.toDataURL("image/jpeg",0.6)
.replace("data:image/jpeg;base64,","");
}

/* ===== ABSEN ===== */
function absen(jenis){

if(!hasilSiswa.value){
showToast("Pilih siswa dulu");
return;
}

let siswa=JSON.parse(hasilSiswa.value);

let form=new FormData();
form.append("action","absen");
form.append("nisn",siswa.nisn);
form.append("nama",siswa.nama);
form.append("kelas",siswa.kelas);
form.append("status",jenis);
form.append("petugas",currentUser);

if(jenis=="Masuk"){
form.append("photo",ambilFoto());
}

showLoading(true);

fetch(API_URL,{method:"POST",body:form})
.then(r=>r.json())
.then(res=>{
showLoading(false);
if(res.status){
showToast("Absensi Berhasil ✅");
}else{
showToast("Gagal ❌");
}
});
}

/* ===== CARI SISWA ===== */
function cari(){
if(searchSiswa.value.length<3)return;

let form=new FormData();
form.append("action","cariSiswa");
form.append("keyword",searchSiswa.value);

fetch(API_URL,{method:"POST",body:form})
.then(r=>r.json())
.then(data=>{
hasilSiswa.innerHTML="";
data.forEach(s=>{
let opt=document.createElement("option");
opt.value=JSON.stringify(s);
opt.text=s.nama+" - "+s.kelas;
hasilSiswa.appendChild(opt);
});
});
}

/* ===== CHART DEMO ===== */
function loadChart(){
new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:["Hadir","Terlambat"],
datasets:[{
label:"Statistik Hari Ini",
data:[12,3],
backgroundColor:["#198754","#dc3545"]
}]
}
});
}

</script>

</body>
</html>
