<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi SMP N 2 Kawali</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* Warna Biru Gelap Degradasi Putih Elegan */
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #f8f9fa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
        }
        .clock {
            font-size: 2rem;
            font-weight: bold;
            color: #0f2027;
            text-align: center;
            margin-bottom: 5px;
        }
        .date {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: #203a43;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Nanti Logo Sekolah taruh disini ganti div ini dengan <img> -->
        <div class="logo-placeholder">LOGO</div>
        
        <h5 class="text-center fw-bold text-uppercase mb-1" style="color: #0f2027;">PORTAL ABSENSI</h5>
        <h6 class="text-center fw-bold mb-4" style="color: #203a43;">SMP N 2 KAWALI</h6>

        <div class="clock" id="jamDigital">00:00:00</div>
        <div class="date" id="tanggalDigital">Senin, 01 Januari 2024</div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Masuk Sebagai</label>
                <select class="form-select" id="roleSelector" required>
                    <option value="" disabled selected>-- Pilih Peran --</option>
                    <option value="admin">User 1 (Admin)</option>
                    <option value="teacher">User 2 (Teacher)</option>
                    <option value="petugas">User 3 (Petugas Absen)</option>
                    <option value="ortu">User 4 (Orang Tua)</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" id="labelUsername">Username / NISN / NIP</label>
                <input type="text" class="form-control" id="username" placeholder="Masukkan ID" required>
            </div>
            <div class="mb-4" id="passwordField">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Masukkan Password">
            </div>
            
            <button type="submit" class="btn btn-primary w-100" style="background-color: #203a43; border: none;">LOGIN KE DASHBOARD</button>
        </form>
    </div>

    <script>
        // Script Jam Digital
        function updateClock() {
            const now = new Date();
            const jam = now.getHours().toString().padStart(2, '0');
            const menit = now.getMinutes().toString().padStart(2, '0');
            const detik = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('jamDigital').innerText = `${jam}:${menit}:${detik}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('tanggalDigital').innerText = now.toLocaleDateString('id-ID', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Script untuk mengubah Label berdasarkan Dropdown
        document.getElementById('roleSelector').addEventListener('change', function() {
            const role = this.value;
            const label = document.getElementById('labelUsername');
            const pass = document.getElementById('passwordField');
            
            if(role === 'admin') { label.innerText = 'Username Admin'; pass.style.display = 'block'; }
            else if(role === 'teacher') { label.innerText = 'NIP Guru'; pass.style.display = 'block'; }
            else if(role === 'petugas') { label.innerText = 'ID Petugas'; pass.style.display = 'block'; }
            else if(role === 'ortu') { 
                label.innerText = 'NISN Siswa'; 
                pass.style.display = 'none'; // Ortu mungkin hanya pakai NISN (bisa diubah nanti)
            }
        });

        // Script Login (Akan dikonekkan ke App Script di Tahap 2)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Tombol diklik! Selanjutnya kita akan integrasikan ini dengan Database Spreadsheet.");
        });
    </script>
</body>
</html>
