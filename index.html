<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Absensi MPLS</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- =======================================================
         SPLASH SCREEN
    ======================================================== -->

    <div id="splashScreen" class="splash">

        <div class="splash-content">

            <img
                src="assets/logo.png"
                alt="Logo Sekolah"
                class="logo">

            <h1>

                SMP Negeri 2 Kawali

            </h1>

            <h2>

                ABSENSI MPLS

            </h2>

            <p>

                Tahun Pelajaran 2026 / 2027

            </p>

            <div class="loader"></div>

            <p id="loadingText">

                Memuat aplikasi...

            </p>

        </div>

    </div>


    <!-- =======================================================
         LOGIN
    ======================================================== -->

    <div id="loginPage"
         class="page hidden">

        <div class="login-card">

            <h2>

                LOGIN

            </h2>

            <label>

                Username / NISN

            </label>

            <input
                type="text"
                id="username"
                autocomplete="off"
                placeholder="Masukkan Username">

            <label>

                Password

            </label>

            <input
                type="password"
                id="password"
                placeholder="Masukkan Password">

            <label>

                Login Sebagai

            </label>

            <select id="role">

                <option value="ADMIN">

                    Admin

                </option>

                <option value="PETUGAS">

                    Petugas

                </option>

                <option value="GURU">

                    Guru

                </option>

                <option value="KEPALA">

                    Kepala Sekolah

                </option>

                <option value="ORANGTUA">

                    Orang Tua

                </option>

            </select>

            <button id="btnLogin">

                MASUK

            </button>

            <div id="loginMessage">

            </div>

        </div>

    </div>


    <!-- =======================================================
         SCRIPT
    ======================================================== -->

    <script src="js/config.js"></script>

    <script src="js/helper.js"></script>

    <script src="js/api.js"></script>

    <script src="js/login.js"></script>

    <script>

        window.onload = function () {

            setTimeout(function () {

                document
                    .getElementById("splashScreen")
                    .style.display = "none";

                document
                    .getElementById("loginPage")
                    .classList.remove("hidden");

            }, 2000);

        };

    </script>

</body>

</html>
