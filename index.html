<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTAL ABSENSI DIGITAL- SMP NEGERI 2 KAWALI</title>
    <!-- FontAwesome untuk Ikon Mata & UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d6efd; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: #ffffff; border-radius: 16px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .logo-container { margin-bottom: 16px; }
        .logo-container img { width: 90px; height: 90px; object-fit: contain; }
        .title { color: #0d6efd; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .subtitle { color: #6c757d; font-size: 13px; font-weight: 600; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 6px; }
        .input-group { position: relative; }
        .form-control { width: 100%; padding: 10px 14px; font-size: 14px; border: 1px solid #ced4da; border-radius: 8px; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: #0d6efd; }
        .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6c757d; font-size: 16px; z-index: 10; }
        .btn-submit { width: 100%; padding: 12px; background-color: #0d6efd; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-submit:hover { background-color: #0b5ed7; }
        #errorMessage { margin-top: 14px; font-size: 13px; font-weight: 600; text-align: center; min-height: 20px; }
    </style>
</head>
<body>

<div class="login-card">
    <!-- MEMANGGIL LOGO DARI DIREKTORI GITHUB Anda -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo SMP Negeri 2 Kawali" id="schoolLogo">
    </div>

    <div class="title">PORTAL ABSENSI</div>
    <div class="subtitle">SMP Negeri 2 Kawali</div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username / NISN</label>
            <input type="text" id="username" class="form-control" placeholder="Masukkan ID / NISN" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-group">
                <input type="password" id="password" class="form-control" placeholder="Masukkan Password" required autocomplete="current-password">
                <i class="fa-solid fa-eye toggle-password" id="btnTogglePassword"></i>
            </div>
        </div>

        <div class="form-group">
            <label for="role">Login Sebagai</label>
            <select id="role" class="form-control">
                <option value="Petugas">Petugas OSIS</option>
                <option value="Guru">Guru / Wali Kelas</option>
                <option value="Admin">Administrator</option>
            </select>
        </div>

        <button type="submit" class="btn-submit" id="btnLogin">MASUK</button>
        <div id="errorMessage"></div>
    </form>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
