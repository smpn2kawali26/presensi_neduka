<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PORTAL ABSENSI SMP N 2 KAWALI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
background: linear-gradient(to bottom right,#1e90ff,#ffffff);
min-height:100vh;
}
.card{
border-radius:20px;
}
#video{
width:100%;
border-radius:15px;
}
</style>
</head>

<body>

<div class="container mt-5">

<h2 class="text-center text-primary fw-bold">
PORTAL ABSENSI SMP N 2 KAWALI
</h2>

<div class="card p-4 shadow mt-4">

<div id="loginArea">

<select id="role" class="form-select mb-2">
<option value="admin">Admin</option>
<option value="teacher">Teacher</option>
<option value="petugas">Petugas</option>
</select>

<input type="text" id="username" class="form-control mb-2" placeholder="Username">
<input type="password" id="password" class="form-control mb-2" placeholder="Password">

<button class="btn btn-primary w-100" onclick="login()">LOGIN</button>

</div>

<div id="dashboard" style="display:none;">

<h5 id="welcome"></h5>
<h3 id="clock" class="text-primary"></h3>

<hr>

<div id="petugasPanel" style="display:none;">

<input type="text" id="searchSiswa" class="form-control mb-2" placeholder="Cari siswa min 3 huruf" onkeyup="cari()">

<select id="hasilSiswa" class="form-select mb-3"></select>

<video id="video" autoplay></video>

<div class="mt-3">
<button class="btn btn-success w-100 mb-2" onclick="absen('Masuk')">ABSEN MASUK</button>
<button class="btn btn-danger w-100" onclick="absen('Pulang')">ABSEN PULANG</button>
</div>

</div>

</div>

</div>
</div>

<script>

const API_URL = "PASTE_URL_WEB_APP_ANDA";

let currentUser = "";

function startClock(){
setInterval(()=>{
const now = new Date();
document.getElementById("clock").innerHTML = now.toLocaleTimeString();
},1000);
}

startClock();

/* ================= LOGIN ================= */

function login(){

const form = new FormData();
form.append("action","login");
form.append("username",document.getElementById("username").value);
form.append("password",document.getElementById("password").value);

fetch(API_URL,{
method:"POST",
body:form
})
.then(res=>res.json())
.then(res=>{

if(res.status){
currentUser = res.nama;

document.getElementById("loginArea").style.display="none";
document.getElementById("dashboard").style.display="block";
document.getElementById("welcome").innerHTML="Selamat Datang, "+res.nama;

if(res.role=="petugas"){
document.getElementById("petugasPanel").style.display="block";
initCamera();
}

}else{
alert("Login Gagal");
}

});
}

/* ================= CAMERA ================= */

function initCamera(){
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
document.getElementById("video").srcObject=stream;
});
}

function ambilFoto(){
const canvas=document.createElement("canvas");
const video=document.getElementById("video");
canvas.width=400;
canvas.height=300;
const ctx=canvas.getContext("2d");
ctx.drawImage(video,0,0,400,300);
return canvas.toDataURL("image/jpeg",0.6).replace("data:image/jpeg;base64,","");
}

/* ================= CARI SISWA ================= */

function cari(){
let key=document.getElementById("searchSiswa").value;
if(key.length<3) return;

const form=new FormData();
form.append("action","cariSiswa");
form.append("keyword",key);

fetch(API_URL,{method:"POST",body:form})
.then(res=>res.json())
.then(data=>{
let select=document.getElementById("hasilSiswa");
select.innerHTML="";
data.forEach(s=>{
let opt=document.createElement("option");
opt.value=JSON.stringify(s);
opt.text=s.nama+" - "+s.kelas;
select.appendChild(opt);
});
});
}

/* ================= ABSEN ================= */

function absen(jenis){

let siswa=JSON.parse(document.getElementById("hasilSiswa").value);

let form=new FormData();
form.append("action","absen");
form.append("nisn",siswa.nisn);
form.append("nama",siswa.nama);
form.append("kelas",siswa.kelas);
form.append("status",jenis);
form.append("petugas",currentUser);

if(jenis=="Masuk"){
form.append("photo",ambilFoto());
}

fetch(API_URL,{method:"POST",body:form})
.then(res=>res.json())
.then(res=>{
if(res.status){
alert("Absensi Berhasil");
}else{
alert("Gagal");
}
});

}

</script>

</body>
</html>
