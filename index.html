<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PORTAL NEDUKA (SMP Negeri 2 Kawali)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .login-header h2 {
      font-size: 24px;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .login-header p {
      font-size: 14px;
      color: #94a3b8;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cbd5e1;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #38bdf8;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #0369a1;
    }
    .btn-submit:disabled {
      background-color: #64748b;
      cursor: not-allowed;
    }
    .alert {
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.4;
    }
    .alert-danger {
      background-color: #7f1d1d;
      color: #fca5a5;
    }
    .alert-success {
      background-color: #14532d;
      color: #86efac;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <!-- Logo Sekolah Disisipkan Kembali dengan Fallback Auto -->
      <img src="logo.png" alt="Logo SMPN 2 Kawali" class="login-logo" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2997/2997295.png';">
      <h2>PORTAL NEDUKA</h2>
      <p>SMP Negeri 2 Kawali</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username / NISN</label>
        <input type="text" id="username" placeholder="Masukkan Username / NISN" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan Password" required autocomplete="current-password">
      </div>

      <div class="form-group">
        <label for="role">Pilih Hak Akses (Role)</label>
        <select id="role">
          <option value="ALL">-- Deteksi Otomatis --</option>
          <option value="PETUGAS">Petugas Absensi / OSIS</option>
          <option value="GURU">Guru / Wali Kelas</option>
          <option value="ADMIN">Administrator</option>
          <option value="KEPSEK">Kepala Sekolah</option>
          <option value="ORTU">Orang Tua / Siswa</option>
        </select>
      </div>

      <button type="submit" id="btnLogin" class="btn-submit">Login</button>
    </form>
  </div>

  <script>
    // =========================================================================
    // URL WEB APP APPS SCRIPT RESMI (SUDAH DISISIPKAN)
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyR5J64U2HYHtUDaVuCAUH73KMcKrnVhavhgIrJbTViflsql7pcqNf2gD6DHxOAdNn-/exec";

    const loginForm = document.getElementById("loginForm");
    const alertBox = document.getElementById("alertBox");
    const btnLogin = document.getElementById("btnLogin");

    // Cek jika user sudah login sebelumnya
    document.addEventListener("DOMContentLoaded", function() {
      const savedUser = localStorage.getItem("user");
      if (savedUser) {
        try {
          const userObj = JSON.parse(savedUser);
          if (userObj && userObj.redirectUrl) {
            window.location.href = userObj.redirectUrl;
          }
        } catch (e) {
          localStorage.removeItem("user");
        }
      }
    });

    loginForm.addEventListener("submit", function(e) {
      e.preventDefault();
      
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;

      if (!username || !password) {
        showAlert("Username dan Password wajib diisi!", "danger");
        return;
      }

      setLoading(true);

      // Membuat URL Parameter
      const params = new URLSearchParams({
        action: "login",
        username: username,
        password: password,
        role: role
      });

      // Mengirimkan Request via JSONP
      const callbackName = "jsonp_callback_" + Math.round(100000 * Math.random());
      
      window[callbackName] = function(response) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        setLoading(false);

        if (response.success) {
          showAlert("Login Berhasil! Mengalihkan...", "success");
          
          // 1. Simpan data user di LocalStorage Browser
          localStorage.setItem("user", JSON.stringify(response.data));

          // 2. Redirect Otomatis Berdasarkan Role dari Backend
          setTimeout(function() {
            if (response.data && response.data.redirectUrl) {
              window.location.href = response.data.redirectUrl;
            } else {
              window.location.href = "petugas.html";
            }
          }, 1000);

        } else {
          showAlert(response.message || "Login gagal. Periksa kembali akun Anda.", "danger");
        }
      };

      const script = document.createElement("script");
      script.src = SCRIPT_URL + "?" + params.toString() + "&callback=" + callbackName;
      
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        setLoading(false);
        showAlert("Gagal terhubung ke server Apps Script. Periksa koneksi internet atau pastikan Web App URL Apps Script sudah diset ke 'Anyone'.", "danger");
      };

      document.body.appendChild(script);
    });

    function showAlert(message, type) {
      alertBox.className = "alert alert-" + type;
      alertBox.innerText = message;
      alertBox.style.display = "block";
    }

    function setLoading(isLoading) {
      if (isLoading) {
        btnLogin.disabled = true;
        btnLogin.innerText = "Memproses Login...";
        alertBox.style.display = "none";
      } else {
        btnLogin.disabled = false;
        btnLogin.innerText = "Login";
      }
    }
  </script>
</body>
</html>
