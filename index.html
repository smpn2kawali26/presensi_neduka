<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORTAL ABSENSI ENTERPRISE</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0d6efd,#4dabf7);
height:100vh;
overflow:hidden;
}

.app{
width:100%;
max-width:420px;
height:100vh;
position:relative;
border-radius:30px;
overflow:hidden;
box-shadow:0 20px 60px rgba(0,0,0,0.4);
background:linear-gradient(160deg,#0d6efd,#74c0fc);
}

.content{
position:absolute;
inset:0;
padding:20px;
padding-bottom:90px;
overflow-y:auto;
}

.logo{
width:85px;
display:block;
margin:0 auto 10px auto;
filter:drop-shadow(0 10px 20px rgba(0,0,0,0.4));
}

.title{
text-align:center;
color:white;
font-weight:700;
font-size:16px;
margin-bottom:10px;
}

.clock{
text-align:center;
color:white;
margin-bottom:15px;
font-size:18px;
font-weight:600;
}

.glass{
background:rgba(255,255,255,0.2);
backdrop-filter:blur(15px);
border-radius:25px;
padding:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
border:1px solid rgba(255,255,255,0.3);
color:white;
}

.bottom-nav{
position:absolute;
bottom:0;
left:0;
right:0;
height:70px;
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
}

.bottom-nav i{
color:white;
font-size:24px;
cursor:pointer;
transition:0.3s;
}

.bottom-nav i:hover{
transform:scale(1.2);
}

.hidden{display:none;}

#video{
width:100%;
border-radius:20px;
}

.active{
color:#ffd43b !important;
}

</style>
</head>

<body>

<div class="app">

<div class="content">

<!-- LOGO -->
<img src="logo.png" class="logo">

<div class="title">
PORTAL ABSENSI<br>
SMP N 2 KAWALI
</div>

<div class="clock" id="clock"></div>

<!-- LOGIN -->
<div class="glass" id="loginArea">

<select id="role" class="form-select mb-3">
<option value="admin">Admin</option>
<option value="teacher">Teacher</option>
<option value="petugas">Petugas</option>
</select>

<input type="text" id="username" class="form-control mb-3" placeholder="Username">
<input type="password" id="password" class="form-control mb-3" placeholder="Password">

<button class="btn btn-primary w-100" onclick="login()">LOGIN</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="glass text-center mb-3">
<h6 id="welcome"></h6>
</div>

<!-- HOME PANEL -->
<div id="homePanel" class="glass mb-3">
<h6>Selamat Datang di Sistem Absensi Digital</h6>
<p>Aplikasi Presensi Modern SMP N 2 Kawali</p>
</div>

<!-- CAMERA PANEL -->
<div id="cameraPanel" class="hidden">

<div class="glass mb-3">
<input type="text" id="searchSiswa" class="form-control mb-2"
placeholder="Cari siswa..." onkeyup="cari()">
<select id="hasilSiswa" class="form-select"></select>
</div>

<div class="glass mb-3">
<video id="video" autoplay playsinline></video>
</div>

<button class="btn btn-success w-100 mb-2" onclick="absen('Masuk')">
ABSEN MASUK
</button>

<button class="btn btn-danger w-100" onclick="absen('Pulang')">
ABSEN PULANG
</button>

</div>

<!-- STAT PANEL -->
<div id="statPanel" class="glass hidden">
<canvas id="chart"></canvas>
</div>

</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav hidden" id="bottomNav">
<i class="bi bi-house-fill active" onclick="showHome()" id="navHome"></i>
<i class="bi bi-camera-fill" onclick="showCamera()" id="navCamera"></i>
<i class="bi bi-bar-chart-fill" onclick="showStat()" id="navStat"></i>
</div>

</div>

<script>

const API_URL="PASTE_URL_WEB_APP_ANDA";
let currentUser="";

/* CLOCK */
setInterval(()=>{
clock.innerHTML=new Date().toLocaleTimeString();
},1000);

/* LOGIN */
function login(){

let form=new FormData();
form.append("action","login");
form.append("username",username.value);
form.append("password",password.value);

fetch(API_URL,{method:"POST",body:form})
.then(r=>r.json())
.then(res=>{
if(res.status){

currentUser=res.nama;
loginArea.classList.add("hidden");
dashboard.classList.remove("hidden");
bottomNav.classList.remove("hidden");
welcome.innerHTML="Selamat Datang, "+res.nama;

if(res.role=="petugas"){
initCamera();
}

}else{
alert("Login Gagal");
}
});
}

/* NAVIGATION */
function resetNav(){
navHome.classList.remove("active");
navCamera.classList.remove("active");
navStat.classList.remove("active");
homePanel.classList.add("hidden");
cameraPanel.classList.add("hidden");
statPanel.classList.add("hidden");
}

function showHome(){
resetNav();
navHome.classList.add("active");
homePanel.classList.remove("hidden");
}

function showCamera(){
resetNav();
navCamera.classList.add("active");
cameraPanel.classList.remove("hidden");
}

function showStat(){
resetNav();
navStat.classList.add("active");
statPanel.classList.remove("hidden");
loadChart();
}

/* CAMERA */
function initCamera(){
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{video.srcObject=stream;});
}

function ambilFoto(){
let canvas=document.createElement("canvas");
canvas.width=400;
canvas.height=300;
canvas.getContext("2d").drawImage(video,0,0,400,300);
return canvas.toDataURL("image/jpeg",0.6)
.replace("data:image/jpeg;base64,","");
}

/* CARI SISWA */
function cari(){
if(searchSiswa.value.length<3)return;

let form=new FormData();
form.append("action","cariSiswa");
form.append("keyword",searchSiswa.value);

fetch(API_URL,{method:"POST",body:form})
.then(r=>r.json())
.then(data=>{
hasilSiswa.innerHTML="";
data.forEach(s=>{
let opt=document.createElement("option");
opt.value=JSON.stringify(s);
opt.text=s.nama+" - "+s.kelas;
hasilSiswa.appendChild(opt);
});
});
}

/* ABSEN */
function absen(jenis){

if(!hasilSiswa.value){
alert("Pilih siswa dulu");
return;
}

let siswa=JSON.parse(hasilSiswa.value);

let form=new FormData();
form.append("action","absen");
form.append("nisn",siswa.nisn);
form.append("nama",siswa.nama);
form.append("kelas",siswa.kelas);
form.append("status",jenis);
form.append("petugas",currentUser);

if(jenis=="Masuk"){
form.append("photo",ambilFoto());
}

fetch(API_URL,{method:"POST",body:form})
.then(r=>r.json())
.then(res=>{
if(res.status){
alert("Absensi Berhasil ✅");
}else{
alert("Gagal ❌");
}
});
}

/* CHART */
function loadChart(){
new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:["Hadir","Terlambat"],
datasets:[{
data:[10,2],
backgroundColor:["#198754","#dc3545"]
}]
}
});
}

</script>

</body>
</html>
