<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi SMP N 2 Kawali</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #001f3f 0%, #004080 60%, #ffffff 100%); min-height: 100vh; background-attachment: fixed; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); color: white; }
        .table-container { background: white; color: #333; border-radius: 10px; padding: 15px; margin-top: 15px; overflow-x: auto; font-size: 0.85rem; }
        .nav-pills .nav-link { color: white; margin: 2px; cursor: pointer; }
        .nav-pills .nav-link.active { background-color: #ffc107; color: #001f3f; font-weight: bold; }
        #clock { font-size: 2.5rem; font-weight: bold; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .logo { width: 70px; filter: drop-shadow(0 0 5px white); }
        video { width: 100%; border-radius: 10px; background: #000; transform: scaleX(-1); }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="text-center mb-4">
        <img src="logo.png" class="logo" alt="Logo">
        <h4 class="text-white fw-bold mt-2">PORTAL ABSENSI SMP N 2 KAWALI</h4>
        <div id="clock">00.00.00</div>
    </div>

    <!-- LOGIN AREA -->
    <div id="loginSection" class="row justify-content-center">
        <div class="col-md-4 glass text-center shadow-lg">
            <h5 class="mb-4">Silakan Login</h5>
            <select id="role" class="form-select mb-3 shadow-sm">
                <option value="admin">User 1 (Admin)</option>
                <option value="teacher">User 2 (Teacher)</option>
                <option value="officer">User 3 (Petugas)</option>
                <option value="parent">User 4 (Orang Tua)</option>
            </select>
            <input type="text" id="user" class="form-control mb-3 shadow-sm" placeholder="Username/NISN">
            <div class="input-group mb-3 shadow-sm">
                <input type="password" id="pass" class="form-control" placeholder="Password">
                <button class="btn btn-light" type="button" onclick="togglePass()"><i id="eyeIcon" class="bi bi-eye"></i></button>
            </div>
            <button onclick="login()" id="btnLogin" class="btn btn-warning w-100 fw-bold shadow">MASUK</button>
        </div>
    </div>

    <!-- SEMUA DASHBOARD AKAN MUNCUL DI SINI -->
    <div id="dashboardArea" class="d-none">
        <div class="glass">
            <div class="d-flex justify-content-between mb-3">
                <h5 id="dashTitle" class="fw-bold">Dashboard</h5>
                <button onclick="location.reload()" class="btn btn-danger btn-sm shadow-sm">Logout</button>
            </div>
            <div id="navArea"></div>
            <div id="contentArea" class="table-container shadow-lg"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx3VQ8YOJVpH-hdrhsFN_2v-sZbN2kHz4x1oGjGybF9AjBNKnMrNBmlYKSf-BiLRiA/exec";
    let MASTER_DATA = {};
    let USER_ACTIVE = {};

    function togglePass() {
        const p = document.getElementById('pass');
        const i = document.getElementById('eyeIcon');
        p.type = p.type === 'password' ? 'text' : 'password';
        i.className = p.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    }

    setInterval(() => { 
        const d = new Date();
        document.getElementById('clock').innerText = d.getHours().toString().padStart(2,'0') + "." + d.getMinutes().toString().padStart(2,'0') + "." + d.getSeconds().toString().padStart(2,'0');
    }, 1000);

    async function login() {
        const btn = document.getElementById('btnLogin');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Loading...';
        const payload = { action: "login", role: document.getElementById('role').value, user: document.getElementById('user').value, pass: document.getElementById('pass').value };
        
        try {
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
            const data = await res.json();
            if(data.status === "success") {
                USER_ACTIVE = data.user;
                const dataRes = await fetch(API_URL, { method: "POST", body: JSON.stringify({action: "getAdminData"}) });
                MASTER_DATA = await dataRes.json();
                
                document.getElementById('loginSection').classList.add('d-none');
                document.getElementById('dashboardArea').classList.remove('d-none');
                initDashboard();
            } else { alert("Login Gagal!"); }
        } catch(e) { alert("Error koneksi!"); }
        btn.innerText = "MASUK";
    }

    function initDashboard() {
        const nav = document.getElementById('navArea');
        const role = USER_ACTIVE.role;
        document.getElementById('dashTitle').innerText = "Dashboard " + role.toUpperCase();

        if(role === 'admin') {
            nav.innerHTML = `
                <ul class="nav nav-pills justify-content-center">
                    <li class="nav-item"><a class="nav-link active" onclick="renderAdmin('siswa')">Siswa</a></li>
                    <li class="nav-item"><a class="nav-link" onclick="renderAdmin('guru')">Guru</a></li>
                    <li class="nav-item"><a class="nav-link" onclick="renderAdmin('jadwal')">Jadwal</a></li>
                    <li class="nav-item"><a class="nav-link" onclick="renderAdmin('rekap')">Rekap</a></li>
                    <li class="nav-item"><a class="nav-link" onclick="renderAdmin('catatan')">Catatan</a></li>
                    <li class="nav-item"><a class="nav-link" onclick="renderAdmin('settings')">Settings</a></li>
                </ul>`;
            renderAdmin('siswa');
        } else if(role === 'officer') {
            renderOfficer();
        } else if(role === 'teacher') {
            renderTeacher();
        } else if(role === 'parent') {
            renderParent();
        }
    }

    // --- RENDER ADMIN ---
    function renderAdmin(tab) {
        const cont = document.getElementById('contentArea');
        if(tab === 'siswa') {
            let h = `<h6>Data Siswa <button onclick="alert('Gunakan modal seperti sebelumnya')" class="btn btn-primary btn-sm float-end">+ Siswa</button></h6>
            <table class="table table-sm"><thead><tr><th>NISN</th><th>Nama</th><th>Kelas</th><th>Ortu</th><th>HP</th></tr></thead><tbody>`;
            MASTER_DATA.siswa.forEach(s => h += `<tr><td>${s.NISN}</td><td>${s.Nama}</td><td>${s.Kelas}</td><td>${s.NamaOrtu}</td><td>${s.NoHPOrtu}</td></tr>`);
            cont.innerHTML = h + "</tbody></table>";
        }
        if(tab === 'catatan') {
            let h = `<h6>Catatan Masuk (Guru & Ortu)</h6>
            <table class="table table-sm"><thead><tr><th>Tanggal</th><th>Pengirim</th><th>Penerima</th><th>Pesan</th><th>Foto</th></tr></thead><tbody>`;
            MASTER_DATA.catatan.forEach(c => {
                let img = c.PhotoURL ? `<a href="${c.PhotoURL}" target="_blank">Lihat</a>` : '-';
                h += `<tr><td>${c.Tanggal}</td><td>${c.Pengirim}</td><td>${c.Penerima}</td><td>${c.Pesan}</td><td>${img}</td></tr>`;
            });
            cont.innerHTML = h + "</tbody></table>";
        }
        // Tambahkan tab lainnya sesuai kebutuhan
    }

    // --- RENDER PETUGAS (USER 3) ---
    function renderOfficer() {
        const cont = document.getElementById('contentArea');
        cont.innerHTML = `
            <div class="text-center">
                <h6>Petugas: ${USER_ACTIVE.nama}</h6>
                <div id="gpsStatus" class="badge bg-danger mb-2">GPS Nonaktif</div>
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas" class="d-none"></canvas>
                <input type="text" id="searchSiswa" class="form-control mt-2" placeholder="Ketik 3 huruf nama siswa..." onkeyup="searchSiswa(this.value)">
                <select id="selectSiswa" class="form-select mt-2"><option value="">-- Pilih Siswa --</option></select>
                <div class="row mt-3">
                    <div class="col-6"><button onclick="takeAbsen('Masuk')" class="btn btn-success w-100 py-3 fw-bold">ABSEN MASUK</button></div>
                    <div class="col-6"><button onclick="takeAbsen('Pulang')" class="btn btn-danger w-100 py-3 fw-bold">ABSEN PULANG</button></div>
                </div>
            </div>`;
        startCamera();
        startGPS();
    }

    // --- LOGIKA KAMERA & GPS ---
    function startCamera() {
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(s => video.srcObject = s);
    }

    function startGPS() {
        navigator.geolocation.getCurrentPosition(p => {
            document.getElementById('gpsStatus').className = "badge bg-success";
            document.getElementById('gpsStatus').innerText = "📍 GPS AKTIF";
            USER_ACTIVE.lat = p.coords.latitude;
            USER_ACTIVE.lng = p.coords.longitude;
        });
    }

    function searchSiswa(val) {
        if(val.length < 3) return;
        const sel = document.getElementById('selectSiswa');
        sel.innerHTML = '<option value="">-- Pilih --</option>';
        MASTER_DATA.siswa.filter(s => s.Nama.toLowerCase().includes(val.toLowerCase())).forEach(s => {
            sel.innerHTML += `<option value="${s.NISN}" data-nama="${s.Nama}" data-kelas="${s.Kelas}">${s.Nama} (${s.Kelas})</option>`;
        });
    }

    async function takeAbsen(status) {
        const sel = document.getElementById('selectSiswa');
        if(!sel.value) return alert("Pilih siswa!");
        
        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video');
        canvas.width = 320; canvas.height = 240;
        canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
        
        const payload = {
            action: "submitAbsen",
            nisn: sel.value,
            nama: sel.options[sel.selectedIndex].dataset.nama,
            kelas: sel.options[sel.selectedIndex].dataset.kelas,
            status: status,
            tanggal: new Date().toLocaleDateString('id-ID'),
            jam: new Date().toLocaleTimeString('id-ID'),
            lat: USER_ACTIVE.lat,
            lng: USER_ACTIVE.lng,
            photo: canvas.toDataURL('image/jpeg', 0.5)
        };

        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();
        if(result.status === 'success') alert("Absen " + status + " Berhasil!");
    }
</script>
</body>
</html>
