<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi SMP N 2 Kawali</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #001f3f 0%, #0074D9 100%); 
            color: white; min-height: 100vh; 
        }
        .glass { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px); 
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); 
            padding: 30px; 
        }
        .logo { width: 80px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="text-center">
        <img src="https://drive.google.com/uc?export=view&id=1NCxcqcyFdvdfgsHW5pztphG0jNPmwqC9" class="logo">
        <h3>PORTAL ABSENSI SMP N 2 KAWALI</h3>
        <h2 id="jam" class="mb-4">00:00:00</h2>
    </div>

    <!-- BOX LOGIN -->
    <div id="loginBox" class="row justify-content-center">
        <div class="col-md-5 glass text-center">
            <h4>Silakan Login</h4>
            <select id="role" class="form-select mb-3">
                <option value="admin">User 1 (Admin)</option>
                <option value="teacher">User 2 (Teacher)</option>
                <option value="officer">User 3 (Petugas)</option>
                <option value="parent">User 4 (Orang Tua)</option>
            </select>
            <input type="text" id="user" class="form-control mb-3" placeholder="NISN / Username">
            <input type="password" id="pass" class="form-control mb-3" placeholder="Password">
            <button onclick="prosesLogin()" class="btn btn-warning w-100">MASUK</button>
        </div>
    </div>

    <!-- TEMPAT DASHBOARD BERGANTI-GANTI -->
    <div id="dashboard" class="mt-4 d-none">
        <div class="glass">
            <h4 id="welcomeMsg">Selamat Datang</h4>
            <hr>
            <div id="contentUI"></div>
        </div>
    </div>
</div>

<script>
    // GANTI URL INI DENGAN URL WEB APP DARI TAHAP 2
    const SCRIPT_URL = "PASTE_URL_WEB_APP_ANDA_DISINI";

    // Update Jam Realtime
    setInterval(() => {
        document.getElementById('jam').innerHTML = new Date().toLocaleTimeString();
    }, 1000);

    async function prosesLogin() {
        const role = document.getElementById('role').value;
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;

        const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "login", role: role, username: user, password: pass })
        });
        
        const data = await res.json();
        if(data.status === "success") {
            alert("Login Berhasil!");
            bukaDashboard(data.user);
        } else {
            alert("Login Gagal! Periksa Username/Password");
        }
    }

    function bukaDashboard(userData) {
        document.getElementById('loginBox').classList.add('d-none');
        document.getElementById('dashboard').classList.remove('d-none');
        document.getElementById('welcomeMsg').innerText = "Halo, " + userData.nama + " (" + userData.role + ")";
        
        // Di sini nanti kita masukkan UI masing-masing Role
        if(userData.role === "admin") UI_Admin();
        if(userData.role === "officer") UI_Petugas();
    }
    
    function UI_Petugas() {
        let html = `
            <h5>Menu Petugas Absen</h5>
            <video id="video" width="100%" autoplay class="rounded mb-2"></video>
            <button class="btn btn-info w-100" onclick="startCamera()">Aktifkan Kamera</button>
            <input type="text" list="listSiswa" class="form-control mt-3" placeholder="Ketik Nama/NISN Siswa...">
            <datalist id="listSiswa"></datalist>
            <button class="btn btn-success mt-3 w-100">Kirim Absen</button>
        `;
        document.getElementById('contentUI').innerHTML = html;
    }
</script>
</body>
</html>
