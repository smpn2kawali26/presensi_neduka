<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi SMP N 2 Kawali</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #001f3f 0%, #004080 60%, #ffffff 100%); min-height: 100vh; background-attachment: fixed; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); color: white; }
        .table-container { background: white; color: #333; border-radius: 10px; padding: 15px; margin-top: 15px; overflow-x: auto; font-size: 0.8rem; }
        .nav-pills .nav-link { color: white; margin: 2px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
        .nav-pills .nav-link.active { background-color: #ffc107; color: #001f3f; font-weight: bold; border: none; }
        #clock { font-size: 2.5rem; font-weight: bold; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .logo { width: 70px; filter: drop-shadow(0 0 5px white); }
        .input-set { width: 80px; font-size: 0.75rem; padding: 2px; text-align: center; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="text-center mb-4">
        <img src="logo.png" class="logo" alt="Logo">
        <h4 class="text-white fw-bold mt-2">PORTAL ABSENSI SMP N 2 KAWALI</h4>
        <div id="clock">00.00.00</div>
    </div>

    <!-- LOGIN AREA -->
    <div id="loginSection" class="row justify-content-center">
        <div class="col-md-4 glass text-center shadow-lg">
            <h5 class="mb-4">Silakan Login</h5>
            <select id="role" class="form-select mb-3 shadow-sm">
                <option value="admin">User 1 (Admin)</option>
                <option value="teacher">User 2 (Teacher)</option>
                <option value="officer">User 3 (Petugas)</option>
                <option value="parent">User 4 (Orang Tua)</option>
            </select>
            <input type="text" id="user" class="form-control mb-3 shadow-sm" placeholder="Username/NISN">
            <div class="input-group mb-3 shadow-sm">
                <input type="password" id="pass" class="form-control" placeholder="Password">
                <button class="btn btn-light" type="button" onclick="togglePass()"><i id="eyeIcon" class="bi bi-eye"></i></button>
            </div>
            <button onclick="login()" id="btnLogin" class="btn btn-warning w-100 fw-bold shadow">MASUK</button>
        </div>
    </div>

    <!-- DASHBOARD AREA -->
    <div id="adminDash" class="d-none">
        <div class="glass shadow-lg">
            <div class="d-flex justify-content-between mb-3">
                <h5 class="fw-bold"><i class="bi bi-gear-fill"></i> Dashboard ADMIN</h5>
                <button onclick="location.reload()" class="btn btn-danger btn-sm shadow-sm">Logout</button>
            </div>
            
            <ul class="nav nav-pills justify-content-center mb-3" id="adminTabs">
                <li class="nav-item"><a class="nav-link active" onclick="renderTab('siswa')">Siswa</a></li>
                <li class="nav-item"><a class="nav-link" onclick="renderTab('guru')">Guru</a></li>
                <li class="nav-item"><a class="nav-link" onclick="renderTab('jadwal')">Jadwal</a></li>
                <li class="nav-item"><a class="nav-link" onclick="renderTab('rekap')">Rekap</a></li>
                <li class="nav-item"><a class="nav-link" onclick="renderTab('catatan')">Catatan</a></li>
                <li class="nav-item"><a class="nav-link" onclick="renderTab('settings')">Settings</a></li>
            </ul>

            <div id="adminContent" class="table-container shadow-lg"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx3VQ8YOJVpH-hdrhsFN_2v-sZbN2kHz4x1oGjGybF9AjBNKnMrNBmlYKSf-BiLRiA/exec";
    let MASTER_DATA = {};

    function togglePass() {
        const p = document.getElementById('pass');
        const i = document.getElementById('eyeIcon');
        p.type = p.type === 'password' ? 'text' : 'password';
        i.className = p.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    }

    setInterval(() => { 
        const d = new Date();
        document.getElementById('clock').innerText = d.getHours().toString().padStart(2,'0') + "." + d.getMinutes().toString().padStart(2,'0') + "." + d.getSeconds().toString().padStart(2,'0');
    }, 1000);

    async function login() {
        const btn = document.getElementById('btnLogin');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Loading...';
        const payload = { action: "login", role: document.getElementById('role').value, user: document.getElementById('user').value, pass: document.getElementById('pass').value };
        try {
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
            const data = await res.json();
            if(data.status === "success") {
                const dataRes = await fetch(API_URL, { method: "POST", body: JSON.stringify({action: "getAdminData"}) });
                MASTER_DATA = await dataRes.json();
                document.getElementById('loginSection').classList.add('d-none');
                document.getElementById('adminDash').classList.remove('d-none');
                renderTab('siswa');
            } else { alert("Login Gagal!"); }
        } catch(e) { alert("Error koneksi!"); }
        btn.innerText = "MASUK";
    }

    function renderTab(tab) {
        const cont = document.getElementById('adminContent');
        document.querySelectorAll('#adminTabs .nav-link').forEach(el => el.classList.remove('active'));
        if(event) event.target.classList.add('active');

        if(tab === 'settings') {
            let h = `<h6 class="fw-bold">Pengaturan Waktu Absensi & Radius</h6>
            <div class="table-responsive">
            <table class="table table-sm table-bordered mt-2 text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Parameter (Key)</th>
                        <th>Value (Umum)</th>
                        <th>Senin</th><th>Selasa</th><th>Rabu</th><th>Kamis</th><th>Jumat</th>
                    </tr>
                </thead>
                <tbody id="setBody">`;
            
            // Urutan Key sesuai gambar Anda
            const keys = ["BatasMasuk", "BatasTelatMasuk", "BatasPulang", "BatasTelatPulang", "Radius"];
            
            keys.forEach(k => {
                let row = MASTER_DATA.settings.find(s => s.Key == k) || {Key:k, Value:"", Senin:"", Selasa:"", Rabu:"", Kamis:"", Jumat:""};
                h += `<tr>
                    <td class="fw-bold">${k}</td>
                    <td><input type="text" class="input-set" data-key="${k}" data-col="Value" value="${row.Value||''}"></td>
                    <td><input type="text" class="input-set" data-key="${k}" data-col="Senin" value="${row.Senin||''}"></td>
                    <td><input type="text" class="input-set" data-key="${k}" data-col="Selasa" value="${row.Selasa||''}"></td>
                    <td><input type="text" class="input-set" data-key="${k}" data-col="Rabu" value="${row.Rabu||''}"></td>
                    <td><input type="text" class="input-set" data-key="${k}" data-col="Kamis" value="${row.Kamis||''}"></td>
                    <td><input type="text" class="input-set" data-key="${k}" data-col="Jumat" value="${row.Jumat||''}"></td>
                </tr>`;
            });
            
            h += `</tbody></table></div>
            <button class="btn btn-success w-100 mt-2 fw-bold" onclick="saveSet()">SIMPAN SEMUA SETTING</button>`;
            cont.innerHTML = h;
        }

        // Tampilkan tab Siswa (Ringkas)
        if(tab === 'siswa') {
            let h = `<h6 class="fw-bold">Data Siswa</h6><table class="table table-sm mt-2"><thead><tr><th>NISN</th><th>Nama</th><th>Kelas</th></tr></thead><tbody>`;
            MASTER_DATA.siswa.forEach(s => h += `<tr><td>${s.NISN}</td><td>${s.Nama}</td><td>${s.Kelas}</td></tr>`);
            cont.innerHTML = h + "</tbody></table>";
        }
    }

    async function saveSet() {
        if(!confirm("Simpan perubahan pengaturan?")) return;
        const rows = [];
        const keys = ["BatasMasuk", "BatasTelatMasuk", "BatasPulang", "BatasTelatPulang", "Radius"];
        
        keys.forEach(k => {
            const inputs = document.querySelectorAll(`input[data-key="${k}"]`);
            let obj = {key: k};
            inputs.forEach(inp => {
                obj[inp.dataset.col.toLowerCase()] = inp.value;
            });
            rows.push(obj);
        });

        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "saveSettings", settings: rows }) });
        alert("Pengaturan Berhasil Diperbarui!");
        login();
    }
</script>
</body>
</html>
