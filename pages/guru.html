<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru - SMPN 2 Kawali</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #eff6ff;
            --white: #ffffff;
            --text: #1e293b;
            --gray: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* Sidebar Minimalis */
        .sidebar { width: 260px; background: var(--white); padding: 30px; border-right: 1px solid #e2e8f0; }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 40px; display: block; }
        .menu-item { padding: 15px; margin-bottom: 10px; border-radius: 12px; cursor: pointer; transition: 0.3s; color: var(--gray); font-weight: 500; }
        .menu-item:hover, .menu-item.active { background: var(--bg); color: var(--primary); }

        /* Content */
        .main { flex: 1; padding: 40px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .stat-card h4 { color: var(--gray); font-size: 14px; margin-bottom: 10px; }
        .stat-card h2 { font-size: 28px; }

        /* Table Style */
        .card { background: var(--white); padding: 30px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: var(--gray); padding: 15px; border-bottom: 2px solid var(--bg); }
        td { padding: 15px; border-bottom: 1px solid var(--bg); }
        .btn-note { background: var(--bg); color: var(--primary); border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-note:hover { background: var(--primary); color: white; }

        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); justify-content:center; align-items:center; }
        .modal-box { background: white; padding: 30px; border-radius: 20px; width: 400px; }
        textarea { width: 100%; height: 120px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin: 15px 0; resize: none; }
        .btn-save { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <a class="logo">PORTAL GURU</a>
        <div class="menu-item active"><i class="fa-solid fa-house"></i> Dashboard</div>
        <div class="menu-item"><i class="fa-solid fa-right-from-bracket"></i> Keluar</div>
    </aside>

    <main class="main">
        <header>
            <h1>Halo, Pak/Bu Guru! 👋</h1>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card"><h4>Total Siswa</h4><h2>32</h2></div>
            <div class="stat-card"><h4>Hadir</h4><h2>28</h2></div>
            <div class="stat-card"><h4>Perlu Catatan</h4><h2>4</h2></div>
        </div>

        <!-- Attendance Recap Table -->
        <div class="card">
            <h3>Rekap Absensi Kelas</h3>
            <table>
                <thead>
                    <tr><th>Nama Siswa</th><th>Status</th><th>Catatan</th></tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Ahmad Fadhil</td>
                        <td><span style="color: green; font-weight: bold;">HADIR</span></td>
                        <td><button class="btn-note" onclick="bukaModal('Ahmad Fadhil')">Tambah Catatan</button></td>
                    </tr>
                    <tr>
                        <td>Siti Aminah</td>
                        <td><span style="color: orange; font-weight: bold;">TELAT</span></td>
                        <td><button class="btn-note" onclick="bukaModal('Siti Aminah')">Tambah Catatan</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Catatan -->
    <div id="modal" class="modal">
        <div class="modal-box">
            <h3 id="modalTitle">Catatan untuk Siswa</h3>
            <textarea id="catatanInput" placeholder="Tulis perkembangan siswa..."></textarea>
            <button class="btn-save" onclick="simpanCatatan()">Simpan Catatan</button>
            <button onclick="tutupModal()" style="background:none; border:none; margin-top:10px; width:100%; color:red; cursor:pointer;">Batal</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        function bukaModal(nama) {
            document.getElementById('modalTitle').innerText = "Catatan untuk " + nama;
            modal.style.display = 'flex';
        }
        function tutupModal() {
            modal.style.display = 'none';
        }
        function simpanCatatan() {
            alert("Catatan berhasil disimpan!");
            tutupModal();
        }
    </script>
</body>
</html>
