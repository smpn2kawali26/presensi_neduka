<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Guru - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

        :root {
            --sidebar-bg: #0f172a;
            --primary: #4f46e5;
            --bg: #f8fafc;
            --white: #ffffff;
            --text-main: #1e293b;
            --text-gray: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 280px; background: var(--sidebar-bg); color: white; padding: 30px; display: flex; flex-direction: column; }
        .logo { font-size: 22px; font-weight: 700; color: white; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .menu-item { padding: 14px 20px; margin-bottom: 8px; border-radius: 12px; cursor: pointer; transition: 0.3s; color: #94a3b8; display: flex; align-items: center; gap: 12px; }
        .menu-item:hover, .menu-item.active { background: var(--primary); color: white; }

        /* Layout Utama */
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .content-wrapper { display: grid; grid-template-columns: 1fr 320px; gap: 30px; }
        
        /* Statistik */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--white); padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .stat-card h4 { color: var(--text-gray); font-size: 13px; margin-bottom: 5px; }
        .stat-card h2 { font-size: 24px; font-weight: 700; }
        .stat-icon { background: #eef2ff; color: var(--primary); padding: 15px; border-radius: 12px; }

        /* Tabel */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: var(--text-gray); font-size: 14px; padding: 15px; border-bottom: 1px solid #f1f5f9; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-hadir { background: #dcfce7; color: #166534; }
        .badge-telat { background: #ffedd5; color: #9a3412; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i> PORTAL GURU</div>
        <div class="menu-item active"><i class="fa-solid fa-house"></i> Dashboard</div>
        <div class="menu-item"><i class="fa-solid fa-right-from-bracket"></i> Keluar</div>
    </aside>

    <main class="main">
        <header style="margin-bottom: 30px;">
            <h1 style="font-size: 24px;">Dashboard</h1>
            <p style="color: var(--text-gray);">Selamat datang kembali, Pak/Bu Guru.</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div><h4>Total Siswa</h4><h2>32</h2></div>
                <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
            </div>
            <div class="stat-card">
                <div><h4>Hadir</h4><h2>28</h2></div>
                <div class="stat-icon"><i class="fa-solid fa-check"></i></div>
            </div>
            <div class="stat-card">
                <div><h4>Perlu Catatan</h4><h2>4</h2></div>
                <div class="stat-icon"><i class="fa-solid fa-pen"></i></div>
            </div>
        </div>

        <div class="content-wrapper">
            <!-- Area Tabel -->
                <h3 style="margin-bottom: 10px;">Rekap Absensi Kelas</h3>
                <table>
                    <thead>
                        <tr><th>Nama</th><th>Status</th><th>Aksi</th></tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Ahmad Fadhil</td>
                            <td><span class="badge badge-hadir">HADIR</span></td>
                            <td><button class="btn-note" onclick="bukaModal('Ahmad Fadhil')">Catatan</button></td>
                        </tr>
                        <tr>
                            <td>Siti Aminah</td>
                            <td><span class="badge badge-telat">TELAT</span></td>
                            <td><button class="btn-note" onclick="bukaModal('Siti Aminah')">Catatan</button></td>
                        </tr>
                    </tbody>
                </table>
        </div>
    </main>
</body>
</html>
