<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Petugas</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Penyesuaian Ukuran Kamera agar Pas dan Tidak Terlalu Besar */
        .camera-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        #camera {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            background: #000;
        }
    </style>
</head>

<body>

    <!-- =======================================================
         HEADER
    ======================================================== -->
    <header class="topbar">
        <div>
            <h2>Dashboard Petugas</h2>
            <p>ABSENSI MPLS - SMP Negeri 2 Kawali</p>
        </div>
        <button id="btnLogout" onclick="doLogout()">Logout</button>
    </header>

    <!-- =======================================================
         KONTEN
    ======================================================== -->
    <main class="container">

        <!-- PETUGAS -->
        <section class="card">
            <h3>Petugas</h3>
            <p>
                Nama : <strong id="namaUser">-</strong>
            </p>
        </section>

        <!-- CARI SISWA -->
        <section class="card">
            <h3>Cari Siswa</h3>
            <input 
                type="text" 
                id="keyword" 
                placeholder="Ketikan nama siswa (contoh: sus)..." 
                autocomplete="off">
            <button id="btnCari">Cari</button>
            <small id="searchStatus" style="display:block; margin-top:8px; color:#666; font-style:italic;"></small>
        </section>

        <!-- DATA SISWA -->
        <section class="card">
            <h3>Data Siswa</h3>
            <table width="100%">
                <tr>
                    <td width="120">ID</td>
                    <td>: <span id="idSiswa">-</span></td>
                </tr>
                <tr>
                    <td>Nama</td>
                    <td>: <span id="namaSiswa">-</span></td>
                </tr>
                <tr>
                    <td>Kelas</td>
                    <td>: <span id="kelasSiswa">-</span></td>
                </tr>
                <tr>
                    <td>Status</td>
                    <td>: <span id="statusSiswa">-</span></td>
                </tr>
            </table>
        </section>

        <!-- KAMERA (UKURAN DIPERSEMPIT) -->
        <section class="card">
            <h3>Kamera</h3>
            <div class="camera-container">
                <video 
                    id="camera" 
                    autoplay 
                    playsinline 
                    muted>
                </video>
                <canvas id="canvas" style="display:none;"></canvas>
                <br><br>
                <button id="btnSwitchCamera">Ganti Kamera</button>
            </div>
        </section>

        <!-- GPS -->
        <section class="card">
            <h3>GPS</h3>
            <p>Latitude : <span id="latitude">-</span></p>
            <p>Longitude : <span id="longitude">-</span></p>
            <p>Akurasi : <span id="accuracy">-</span></p>
        </section>

        <!-- ABSENSI -->
        <section class="card">
            <button id="btnMasuk">ABSEN MASUK</button>
            <br><br>
            <button id="btnPulang">ABSEN PULANG</button>
        </section>

    </main>

    <!-- =======================================================
         SCRIPT APLIKASI
    ======================================================== -->
    <script src="../js/config.js"></script>
    <script src="../js/helper.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/camera.js"></script>
    <script src="../js/absensi.js"></script>

    <!-- =======================================================
         LOGIKA PENCARIAN SISWA (BEBAS ERROR UNDEFINED)
    ======================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const inputKeyword = document.getElementById("keyword");
            const btnCari = document.getElementById("btnCari");
            const searchStatus = document.getElementById("searchStatus");
            let debounceTimer;

            function eksekusiPencarian() {
                const query = inputKeyword.value.trim();

                if (!query) {
                    resetDataSiswa();
                    if (searchStatus) searchStatus.innerText = "";
                    return;
                }

                if (searchStatus) searchStatus.innerText = "Mencari...";

                if (typeof callAPI === "function") {
                    callAPI({
                        action: "searchSiswa",
                        data: { keyword: query }
                    })
                    .then(res => {
                        if (res && res.success && res.data && res.data.length > 0) {
                            const siswa = res.data[0]; 
                            tampilkanDataSiswa(siswa);
                            if (searchStatus) searchStatus.innerText = "Data ditemukan!";
                        } else {
                            resetDataSiswa();
                            if (searchStatus) searchStatus.innerText = "Siswa tidak ditemukan.";
                        }
                    })
                    .catch(err => {
                        console.error("Error pencarian:", err);
                        if (searchStatus) searchStatus.innerText = "Gagal memuat data.";
                    });
                }
            }

            // Mencegah 'undefined' dengan memeriksa semua kemungkinan kunci properti dari response backend
            function tampilkanDataSiswa(s) {
                const id = s.idSiswa || s.ID_SISWA || s.id || s.nisn || s.NISN || "-";
                const nama = s.nama || s.NAMA || s.namaSiswa || "-";
                const kelas = s.kelas || s.KELAS || s.kelasSiswa || "-";
                const status = s.status || s.STATUS || "AKTIF";

                if (document.getElementById("idSiswa")) document.getElementById("idSiswa").innerText = id;
                if (document.getElementById("namaSiswa")) document.getElementById("namaSiswa").innerText = nama;
                if (document.getElementById("kelasSiswa")) document.getElementById("kelasSiswa").innerText = kelas;
                if (document.getElementById("statusSiswa")) document.getElementById("statusSiswa").innerText = status;
            }

            function resetDataSiswa() {
                if (document.getElementById("idSiswa")) document.getElementById("idSiswa").innerText = "-";
                if (document.getElementById("namaSiswa")) document.getElementById("namaSiswa").innerText = "-";
                if (document.getElementById("kelasSiswa")) document.getElementById("kelasSiswa").innerText = "-";
                if (document.getElementById("statusSiswa")) document.getElementById("statusSiswa").innerText = "-";
            }

            // Pencarian Otomatis saat Mengetik (Debounce 300ms)
            if (inputKeyword) {
                inputKeyword.addEventListener("input", function () {
                    clearTimeout(debounceTimer);
                    const val = this.value.trim();

                    if (val.length >= 2) { // Dimulai dari 2 karakter
                        debounceTimer = setTimeout(() => {
                            eksekusiPencarian();
                        }, 300);
                    } else if (val.length === 0) {
                        resetDataSiswa();
                        if (searchStatus) searchStatus.innerText = "";
                    }
                });
            }

            if (btnCari) {
                btnCari.addEventListener("click", function (e) {
                    e.preventDefault();
                    eksekusiPencarian();
                });
            }
        });
    </script>
</body>

</html>
